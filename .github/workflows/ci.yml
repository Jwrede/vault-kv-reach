name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image:
          - hashicorp/vault:2.2.2
          - hashicorp/vault:1.21.4
          - hashicorp/vault:latest
          - openbao/openbao:2.7.2
          - openbao/openbao:2.5.5
          - openbao/openbao:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: e2e (API and web UI)
        env:
          VKR_E2E_CHROME: google-chrome
          UI_SHOTS: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$UI_SHOTS"
          IMAGE=${{ matrix.image }} e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ strategy.job-index }}
          path: ${{ runner.temp }}/shots
